<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="amber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)"/>
  
  <!-- Outer subtle circuit circle -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#1e293b" stroke-width="4" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#334155" stroke-width="2"/>
  
  <!-- Circuit Nodes -->
  <circle cx="256" cy="76" r="8" fill="#F59E0B"/>
  <circle cx="436" cy="256" r="8" fill="#38BDF8"/>
  <circle cx="76" cy="256" r="8" fill="#38BDF8"/>
  <circle cx="256" cy="436" r="8" fill="#F59E0B"/>

  <!-- Ohm Symbol (Omega) -->
  <path d="M 176 348 L 132 348 C 123 348 116 341 116 332 C 116 323 123 316 132 316 L 180 316 C 187 316 193 313 198 308 C 172 278 160 236 168 194 C 180 132 232 88 296 88 C 360 88 412 132 424 194 C 432 236 420 278 394 308 C 399 313 405 316 412 316 L 460 316 C 469 316 476 323 476 332 C 476 341 469 348 460 348 L 416 348 C 400 348 386 336 383 320 C 372 260 338 212 256 212 C 174 212 140 260 129 320 C 126 336 112 348 96 348" 
        fill="none" stroke="none"/>

  <!-- Bold Omega Path -->
  <path d="M 130 356 H 188 C 205 356 220 344 224 327 C 235 277 265 244 296 244 C 327 244 357 277 368 327 C 372 344 387 356 404 356 H 462 C 475 356 486 345 486 332 C 486 319 475 308 462 308 H 422 C 442 272 448 230 436 188 C 416 118 354 68 280 68 C 206 68 144 118 124 188 C 112 230 118 272 138 308 H 98 C 85 308 74 319 74 332 C 74 345 85 356 98 356 Z" 
        fill="url(#blue-grad)" opacity="0.25"/>

  <!-- Clean, Iconic Ohm Symbol & Lightning Bolt -->
  <g transform="translate(40, 20)">
    <!-- Ohm Symbol -->
    <path d="M 110 330 L 160 330 C 174 330 186 320 190 306 C 202 262 232 232 276 232 C 320 232 350 262 362 306 C 366 320 378 330 392 330 L 442 330 C 452 330 460 322 460 312 C 460 302 452 294 442 294 L 406 294 C 420 264 426 232 422 198 C 412 128 354 74 284 72 C 206 70 142 128 134 204 C 130 236 138 266 150 294 L 110 294 C 100 294 92 302 92 312 C 92 322 100 330 110 330 Z" 
          fill="none" stroke="url(#blue-grad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Central Lightning Spark (representing electric energy & calculation) -->
    <polygon points="236,130 186,250 230,250 200,350 290,220 244,220 274,130" 
             fill="url(#amber-grad)" filter="url(#glow)"/>
  </g>
</svg>
